name: Auto Sync Live Streams

on:
  # 已关闭定时自动同步 (原为: cron: '*/30 * * * *')
  workflow_dispatch:        # 仅支持在 GitHub 网页上手动一键触发更新

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Stream Sync
        run: |
          python3 scripts/sync_live_streams.py

      - name: Commit and Push Updated Streams
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto sync latest live streams [skip ci]" && git push)
