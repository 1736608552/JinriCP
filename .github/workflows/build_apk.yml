name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v.* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            TAG="v1.2.1"
            VERSION="1.2.1"
          fi
          BUILD_NUMBER=131
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG}, Version: ${VERSION}, Build Number: ${BUILD_NUMBER}"

      - name: Precache Flutter Artifacts
        run: flutter precache --android

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
        run: |
          flutter build apk --release --build-name=${{ steps.get_version.outputs.version }} --build-number=${{ steps.get_version.outputs.build_number }} --android-skip-build-dependency-validation || \
          (echo "First build attempt failed, retrying in 5s..." && sleep 5 && flutter build apk --release --build-name=${{ steps.get_version.outputs.version }} --build-number=${{ steps.get_version.outputs.build_number }} --android-skip-build-dependency-validation)

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/JinriCP-Pure-${{ steps.get_version.outputs.tag_name }}.apk"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "JinriCP-Pure-${{ steps.get_version.outputs.tag_name }}"
          path: release-artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "JinriCP 纯净原生版 ${{ steps.get_version.outputs.tag_name }} (Build 131)"
          body: |
            ### 🌟 JinriCP 纯净原生 Android 客户端 ${{ steps.get_version.outputs.tag_name }} 全新高定播控交互与视觉系统发布

            - 🎨 **全新高定 UI 与视觉规范升级**：
              - 沉浸式电影级暗黑底色与流光渐变（`playerTopScrim` / `playerBottomScrim`），彻底消除画面高亮时文字遮挡失真；
              - 纯正毛玻璃拟态质感胶囊（`playerGlassDecoration`），带来极致通透视效体验。
            - 🎛️ **全能播控手势与极简毛玻璃 HUD**：
              - 左右双侧滑动阻尼控光控音，居中半透明高斯模糊 HUD 实时反馈数值；
              - 短剧支持横向滑屏快进/快退（Seek 预览）、长按屏幕 2.0x 极速快进；
              - 全新单向防误触锁屏按钮，全屏观影更沉浸纯粹。
            - ⚡ **直播与短剧播放体验全面跃升**：
              - 直播间支持一键播放/暂停、自适应画面铺满切换；
              - 短剧支持 1.0x / 1.25x / 1.5x / 2.0x 循环无级倍速切换与轻触振动反馈；
              - 底部导航栏切换增加触觉感知反馈，手感更加灵动跟手。
            - 🛡️ **底层依赖与构建加固**：
              - 锁定依赖版本契约，支持 Android 各版本无感覆盖升级（`versionCode=131`）。
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
