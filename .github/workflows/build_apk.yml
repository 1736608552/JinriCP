name: Build and Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v.* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            TAG="v1.2.0"
            VERSION="1.2.0"
          fi
          # 固定 versionCode=130，确保高于上一版 v1.1.9(120) 与 v1.1.8(109)，避免 Android 降级安装报错 (-25)
          BUILD_NUMBER=130
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG}, Version: ${VERSION}, Build Number: ${BUILD_NUMBER}"

      - name: Build Release APK
        run: flutter build apk --release --build-name=${{ steps.get_version.outputs.version }} --build-number=${{ steps.get_version.outputs.build_number }} --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/JinriCP-Pure-${{ steps.get_version.outputs.tag_name }}.apk"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "JinriCP-Pure-${{ steps.get_version.outputs.tag_name }}"
          path: release-artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "JinriCP 纯净原生版 ${{ steps.get_version.outputs.tag_name }} (Build 130)"
          body: |
            ### 🌟 JinriCP 纯净原生 Android 客户端 ${{ steps.get_version.outputs.tag_name }} 紧急修复黄瓜短剧播放与在线升级全链路

            - 🥒 **紧急彻底修复黄瓜短剧播放（解决《秘密教学》等无限转圈 Loading）**：
              - 深度排查发现黄瓜短剧页面 SSR 将斜杠全量编码为 `\u002F` 导致原正则匹配全部落空；
              - 全新接入 Nuxt 3 数据岛深度反序列化引擎，直接精准直连 `media.source_url` 真实带签名的 m3u8 直连流；
              - 选集列表 1:1 对齐官方真实全分集，首集与后续各分集秒开起播，彻底杜绝转圈卡死。
            - 🔄 **全面修复在线更新全链路（开箱即用、一键在线无缝升级）**：
              - 仓库正式对齐公开仓库 `1736608552/JinriCP`，手机端免 Token 即可匿名检测最新版本；
              - 内置局域网超高速直连与国内优质 CDN 镜像加速通道（`ghfast.top` 等），千兆秒下；
              - 固定 `versionCode=130`，系统判定为标准平滑更新，彻底杜绝系统报错【-25 无法降级安装】。
            - 🎬 **黄果短剧改版异步 Playback API 与发布页首选保序特性完整继承**：
              - 双短剧源各自独立记忆，开箱秒播，纯净零广告。
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
