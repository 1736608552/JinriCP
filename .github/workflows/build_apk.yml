name: Build and Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v.* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            TAG="v1.1.9"
            VERSION="1.1.9"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG}, Version: ${VERSION}"

      - name: Build Release APK
        run: flutter build apk --release --build-name=${{ steps.get_version.outputs.version }} --build-number=${{ github.run_number }} --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/JinriCP-Pure-${{ steps.get_version.outputs.tag_name }}.apk"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "JinriCP-Pure-${{ steps.get_version.outputs.tag_name }}"
          path: release-artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "JinriCP 纯净原生版 ${{ steps.get_version.outputs.tag_name }} (Build ${{ github.run_number }})"
          body: |
            ### 🌟 JinriCP 纯净原生 Android 客户端 ${{ steps.get_version.outputs.tag_name }} 紧急修复黄果短剧改版播放与线路增强

            - 🎬 **紧急修复黄果短剧改版播放（解决无限转圈 Loading）**：
              - 适配黄果短剧源站最新异步 Playback API（`POST /api/videos/{dramaId}/episodes/{episodeNum}/playback`）；
              - 自动提取真实带时效签名的 m3u8 直连流，彻底告别旧版客户端因内联数据为空导致的死循环转圈与黑屏；
              - 建立多线路高可用自动降级轮询机制，主线路与备用线路秒级自动容灾。
            - 🌐 **发布页线路锁定策略：严格默认调用第 1 个地址**：
              - 默认发布页源站正式更新为 `https://huangguoai.ai/`；
              - 保序解析发布页 HTML 结构中的路线列表，100% 默认锁定提取出的第一条推荐线路；
              - 无论用户输入哪个发布页（如 `huangguo4.com`、`huangguo2.com` 等），自动保序提取首条线路并即时生效。
            - 🥒 **黄瓜短剧 1:1 全维度分类矩阵与双源独立记忆**：
              - 四维矩阵（内容线 / 标签 / 状态 / 排序）与官方原生对齐；
              - 双源专属记忆，无缝秒级切换；
              - 100% 纯净无广告，极速开播。
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
